# YOLOv11n-CBGS
# Full name: YOLOv11n with CIB_C2f, MEFA/MSP-ELA, CGA/HGA, and
# Coral Boundary-Guided Small-object Detection Head.
# Keeps the three most stable paper modules and replaces the CSAT-style
# detection enhancement with the CBGS head on P2/P3/P4/P5 features.

nc: 3
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C2fCIB, [256, true, true]]   # 2-P2/4, CIB_C2f / RLI-CBFA
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C2fCIB, [512, true, true]]   # 4-P3/8, CIB_C2f / RLI-CBFA
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C2fCIB, [512, true, true]]   # 6-P4/16, CIB_C2f / RLI-CBFA
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C2fCIB, [1024, true, true]]  # 8-P5/32, CIB_C2f / RLI-CBFA
  - [-1, 1, MEFA, [256, 4]]          # 9-P5/32, MSP-ELA-style context
  - [-1, 2, C2PSA, [1024]]           # 10-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # 12 cat backbone P4/16
  - [-1, 2, C3k2, [512, false]]      # 13-P4/16
  - [-1, 1, CGA, [128, 4]]           # 14-P4/16, CGA/HGA

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # 16 cat backbone P3/8
  - [-1, 2, C3k2, [256, false]]      # 17-P3/8
  - [-1, 1, CGA, [64, 4]]            # 18-P3/8, CGA/HGA
  - [-1, 1, MEFA, [64, 4]]           # 19-P3/8, MSP-ELA-style local context

  # CBGS-Head: P2/4 high-resolution branch for small coral regions.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]        # 21 cat backbone P2/4
  - [-1, 2, C3k2, [128, false]]      # 22-P2/4
  - [-1, 1, CBGS, [32, 4]]           # 23-P2/4 boundary-guided small-object feature

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]       # 25 cat head P3/8
  - [-1, 2, C3k2, [256, false]]      # 26-P3/8
  - [-1, 1, CBGS, [64, 4]]           # 27-P3/8 boundary-guided feature

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]       # 29 cat head P4/16
  - [-1, 2, C3k2, [512, false]]      # 30-P4/16
  - [-1, 1, CBGS, [128, 4]]          # 31-P4/16 boundary-guided feature

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # 33 cat backbone/head P5/32
  - [-1, 2, C2fCIB, [1024, true, true]]  # 34-P5/32, CIB_C2f / RLI-CBFA
  - [-1, 1, CGA, [256, 4]]           # 35-P5/32, CGA/HGA
  - [-1, 1, CBGS, [256, 4]]          # 36-P5/32 boundary-guided feature

  - [[23, 27, 31, 36], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)

